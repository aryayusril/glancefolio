<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
    <title>Glancefolio</title>
    <style>
      html, body {
        margin: 0;
        min-height: 100%;
        /* ER brand dark-theme surface (#232323) + Neutral-200 text (#E5E5E5). */
        background: #232323;
        color: #E5E5E5;
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        touch-action: manipulation;
        -webkit-text-size-adjust: 100%;
        overscroll-behavior: none;
      }
      #app {
        max-width: 480px;
        margin: 0 auto;
        padding: 24px 20px 40px;
        box-sizing: border-box;
      }
      #app h1 {
        font-size: 20px;
        margin: 0 0 16px;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 0;
        border-bottom: 1px solid #3a3a3a;
      }
      .row span {
        font-weight: 600;
        letter-spacing: 0.04em;
      }
      .row input {
        width: 140px;
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid #4a4a4a;
        background: #2c2c2c;
        color: #E5E5E5;
        font-size: 15px;
      }
      .note {
        margin-top: 18px;
        font-size: 13px;
        color: #a3a3a3;
      }
    </style>
  </head>
  <body>
    <div id="app">Companion app is running. Check the glasses display.</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
